<!doctype html>
<html lang="lv" data-sh="pl">
<head>
<meta charset="utf-8">
<script>/*SH viena saite: lietotne strādā tikai portālā vaitkevix.cloud/sh. © VAITKEVIX, SIA*/(function(){try{if(window.top!==window)return}catch(e){return}if(/^(localhost|127\.|sh\.test)/.test(location.hostname))return;var h=location.hash.slice(1);location.replace('https://vaitkevix.cloud/sh/#pl'+(h?'/'+h:''))})()</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f4f2">
<title>SH | Zāles pļaušana</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<!-- SH | Zāles pļaušana — grafiks veidojas pats (intervāls, slodze, lietus, nepaspētie), izpilde ar bildi. © VAITKEVIX, SIA -->
<style>
:root{--bg:#f1f4f2;--surf:#fff;--surf2:#f3f5f4;--ink:#17201c;--ink2:#4a534f;--ink3:#6d7672;--dark:#17201c;--ondark:#fff;
  --mint:#d6e8e1;--sand:#f4e4b4;--sky:#d8e6f2;--rose:#f5dbe3;--lilac:#e2ddf2;--ok:#2f5d45;--warn:#6b4a00;--bad:#8a2a3b}
:root[data-theme="dark"]{--bg:#0b120f;--surf:#151d1a;--surf2:#1b2521;--ink:#eef2ef;--ink2:#b4bdb8;--ink3:#8b958f;--dark:#eef2ef;--ondark:#0b120f;
  --mint:#1e3a32;--sand:#3d3520;--sky:#1e2f3d;--rose:#3d2530;--lilac:#2c2840;--ok:#8fd1ad;--warn:#f0c46b;--bad:#f3a0b0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.top .t{flex:1;min-width:0}
.top small{display:block;font-size:13px;font-weight:700;color:var(--ink3)}
.top h1{margin:2px 0 0;font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:var(--surf);display:grid;place-items:center;flex:none;color:var(--ink)}
.ib.dk{background:var(--dark);color:var(--ondark)}
.card{border-radius:28px;background:var(--surf);padding:16px 18px}
.mint{background:var(--mint)}.sand{background:var(--sand)}.sky{background:var(--sky)}.rose{background:var(--rose)}.lilac{background:var(--lilac)}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 10px}
.sec h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border:0;border-radius:999px;background:var(--surf);font-size:14px;font-weight:800;text-decoration:none;color:var(--ink);white-space:nowrap}
.pill.dk{background:var(--dark);color:var(--ondark)}
.pill.big{min-height:56px;padding:0 22px;font-size:16px}
.seg{display:flex;gap:6px;padding:6px;border-radius:999px;background:var(--surf);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{min-height:40px;padding:0 16px;border:0;border-radius:999px;background:transparent;font-size:14px;font-weight:800;white-space:nowrap}
.seg button.on{background:var(--dark);color:var(--ondark)}
.banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:24px;margin:0 0 12px}
.banner b{display:block;font-size:14px;font-weight:800}.banner span{display:block;font-size:12.5px;font-weight:700;color:var(--ink2)}
.dot{width:40px;height:40px;border-radius:50%;background:var(--surf);display:grid;place-items:center;flex:none}
.prog .row{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink2)}
.prog .big{display:flex;align-items:baseline;gap:6px;margin-top:4px}.prog .big b{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}.prog .big span{font-size:16px;font-weight:800;color:var(--ink2)}
.bar{height:8px;border-radius:999px;background:rgba(23,32,28,.15);margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;border-radius:999px;background:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.stop{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:22px;background:var(--surf);border:0;width:100%;text-align:left}
.stop .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:14px;font-weight:800;background:var(--surf2)}
.stop .tx{flex:1;min-width:0}.stop .tx b{display:block;font-size:14.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stop .tx span{display:block;font-size:12.5px;font-weight:700;color:var(--ink2)}
.chip{flex:none;font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px;background:var(--surf2)}
.chip.wrap{flex:1 1 100%;white-space:normal;border-radius:14px;line-height:1.4}
.s-done .n{background:var(--mint)}.s-done .chip{color:var(--ok)}
.s-moved{background:var(--sand)}.s-moved .n,.s-moved .chip{background:var(--surf)}.s-moved .chip{color:var(--warn)}
.s-cant .n{background:var(--rose)}.s-cant .chip{color:var(--bad)}
.empty{padding:28px 18px;text-align:center;font-weight:700;color:var(--ink3)}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;width:min(560px,calc(100% - 32px));display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:6px;border-radius:999px;background:var(--surf);box-shadow:0 8px 28px -12px rgba(16,32,26,.4)}
.tabs button{min-height:48px;border:0;border-radius:999px;background:transparent;font-size:13.5px;font-weight:800}
.tabs button.on{background:var(--dark);color:var(--ondark)}
/* kalendārs */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{font-size:12px;font-weight:800;color:var(--ink3);text-align:center;padding:4px 0}
.cal .d{min-height:84px;border-radius:16px;padding:8px;border:0;text-align:left;display:flex;flex-direction:column;gap:2px;background:var(--surf2)}
.cal .d b{font-size:15px;font-weight:800}.cal .d span{font-size:12px;font-weight:800}.cal .d small{font-size:11px;font-weight:700;color:var(--ink2)}
.cal .d.we{background:transparent;opacity:.55}.cal .d.blank{visibility:hidden}
.cal .d.done{background:var(--mint)}.cal .d.rain{background:var(--sky)}.cal .d.got{background:var(--sand)}
.cal .d.today{outline:2px solid var(--ink);outline-offset:-2px}.cal .d.sel{outline:2px dashed var(--ink);outline-offset:-2px}
@media(max-width:560px){.cal .d{min-height:58px;padding:6px}.cal .d small{display:none}.cal .d span{font-size:11px}}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.grid2{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}.grid2>.main{flex:999 1 560px;min-width:0}.grid2>.side{flex:1 1 300px;min-width:0}
.log{display:flex;flex-direction:column;gap:8px}.log div{padding:10px 12px;border-radius:16px;background:var(--surf)}
.log b{display:block;font-size:13.5px;font-weight:800}.log span{font-size:12px;font-weight:700;color:var(--ink2)}
/* objekti */
.search{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}.search input{flex:1 1 220px;height:48px;border:0;border-radius:999px;background:var(--surf);padding:0 18px;font-size:16px;font-weight:700;min-width:0}
.obj{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:var(--surf);border:0;width:100%;text-align:left}
.obj .tx{flex:1;min-width:0}.obj b{display:block;font-size:14.5px;font-weight:800}.obj span{font-size:12.5px;font-weight:700;color:var(--ink2)}
.obj.off{opacity:.6}
/* lapas */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(8,20,16,.45);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.sheet-bg{align-items:center}}
.sheet{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{border-radius:28px}}
.sheet .hd{display:flex;align-items:center;gap:10px;margin:0 0 14px}.sheet .hd h3{margin:0;flex:1;font-size:20px;font-weight:800;letter-spacing:-.02em}
.f{margin:0 0 12px}.f label,.f .lb{display:block;font-size:13px;font-weight:800;color:var(--ink2);margin:0 0 6px 4px}
.f input,.f select,.f textarea{width:100%;height:48px;border:0;border-radius:16px;background:var(--surf);padding:0 16px;font-size:16px;font-weight:700}
.f textarea{height:auto;min-height:80px;padding:12px 16px}
.row2{display:flex;gap:8px}.row2>*{flex:1;min-width:0}
.photos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.photos .ph{aspect-ratio:1;border-radius:18px;background:var(--surf) center/cover no-repeat;position:relative}
.photos .add{aspect-ratio:1;border-radius:18px;border:2px dashed #c9d3ce;background:var(--surf);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:800}
.photos .ph button{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff}
.checks{border-radius:22px;background:var(--surf);padding:4px}
.checks label{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;font-size:15px;font-weight:700}
.checks input{width:22px;height:22px;accent-color:var(--ink);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{min-height:44px;padding:0 14px;border:0;border-radius:999px;background:var(--surf);font-size:13.5px;font-weight:800}
.chips button.on{background:var(--dark);color:var(--ondark)}
.acts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:8px;margin-top:14px}
.acts button{min-height:56px;border:0;border-radius:999px;font-size:16px;font-weight:800}
.btn-dk{background:var(--dark);color:var(--ondark)}.btn-rose{background:var(--rose)}.btn-lt{background:var(--surf)}
.thumbs{display:flex;gap:6px;margin-top:6px}.thumbs img{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--surf2)}
.gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.gate .card{width:min(380px,100%);text-align:center;padding:28px 22px}
.gate input{width:100%;height:56px;border:0;border-radius:18px;background:var(--surf2);text-align:center;font-size:22px;font-weight:800;margin:14px 0 10px}
.gate input::placeholder{font-size:16px;font-weight:700;color:var(--ink3)}
.gate .err{min-height:20px;color:var(--bad);font-weight:700;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;max-width:calc(100% - 32px);padding:12px 18px;border-radius:999px;background:var(--dark);color:var(--ondark);font-weight:800;font-size:14px}
.toast.err{background:#8a2a3b;color:#fff}
.skel{height:64px;border-radius:22px;background:var(--surf);opacity:.6;margin-bottom:8px}
.copy{text-align:center;font-size:11px;font-weight:700;color:var(--ink3);margin:24px 0 0}
</style>
</head>
<body>
<section class="gate" id="vGate" hidden>
  <form class="card" id="gateForm">
    <h2 style="margin:0;font-size:22px;font-weight:800">SH | Zāles pļaušana</h2>
    <p style="margin:4px 0 0;color:var(--ink3);font-weight:700;font-size:14px">Ienāciet ar savu portāla PIN</p>
    <input id="gPin" type="password" inputmode="text" autocomplete="current-password" placeholder="PIN" aria-label="PIN">
    <div class="err" id="gErr"></div>
    <button class="pill dk big" style="width:100%" type="submit">Ienākt</button>
    <p class="copy">© VAITKEVIX, SIA</p>
  </form>
</section>

<main class="wrap" id="vApp" hidden>
  <header class="top">
    <div class="t"><small id="hdSub">Zāles pļaušana</small><h1 id="hdTitle">Šodien</h1></div>
    <button class="ib" id="btnTheme" aria-label="Tumšais režīms"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
    <button class="ib" id="btnRefresh" aria-label="Atjaunot"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    <button class="ib dk" id="btnMe" aria-label="Profils">··</button>
  </header>
  <div id="view"></div>
  <p class="copy">© VAITKEVIX, SIA</p>
</main>
<nav class="tabs" id="tabs" hidden></nav>

<script>
'use strict';
const API = 'https://aizvietosana-api.vaitkevix.workers.dev/pl', IMG = 'https://aizvietosana-api.vaitkevix.workers.dev/img?sz=w400&id=';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
const S = { pin: ls.get('plausana_pin') || '', tab: 'today', day: '', ym: '', month: null, q: '', grp: '', D: null };
const ROLE = { admin: 'Administrators', vaditajs: 'Darbu vadītājs', izpilditajs: 'Izpildītājs' };
const WD = ['P', 'O', 'T', 'C', 'Pk', 'S', 'Sv'], MON = ['janvāris', 'februāris', 'marts', 'aprīlis', 'maijs', 'jūnijs', 'jūlijs', 'augusts', 'septembris', 'oktobris', 'novembris', 'decembris'];
const addDays = (d, n) => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const dow = (d) => { const w = new Date(d + 'T12:00:00Z').getUTCDay(); return w === 0 ? 7 : w; };
const lvLong = (d) => { const x = new Date(d + 'T12:00:00Z'); return x.toLocaleDateString('lv-LV', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }); };
const lvS = (d) => d ? (+d.slice(8, 10)) + '.' + d.slice(5, 7) + '.' : '';
const m2f = (n) => Math.round(+n || 0).toLocaleString('lv-LV');
const role = () => (S.D && S.D.me.role) || '';
const can = (r) => ({ admin: 3, vaditajs: 2, izpilditajs: 1 }[role()] || 0) >= ({ admin: 3, vaditajs: 2, izpilditajs: 1 }[r]);

function toast(t, kind) { document.querySelectorAll('.toast').forEach(x => x.remove()); const el = document.createElement('div'); el.className = 'toast' + (kind === 'err' ? ' err' : ''); el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 3200); }
async function api(action, data) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, pin: S.pin }, data || {})) });
  const j = await r.json().catch(() => ({ ok: false, error: 'Serveris neatbild' }));
  if (!j.ok) { const e = new Error(j.error || 'Kļūda'); e.code = j.code; throw e; }
  return j;
}
function sheet(html) { closeSheet(); const b = document.createElement('div'); b.className = 'sheet-bg'; b.id = 'sheetBg'; b.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  b.addEventListener('click', e => { if (e.target === b || e.target.closest('[data-x]')) closeSheet(); }); document.body.appendChild(b); return b.firstChild; }
function closeSheet() { const b = $('sheetBg'); if (b) b.remove(); }
const X = '<button class="ib" data-x aria-label="Aizvērt"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>';

/* ---------- ieeja ---------- */
function showGate(msg) { $('vApp').hidden = true; $('tabs').hidden = true; $('vGate').hidden = false; $('gErr').textContent = msg || ''; setTimeout(() => $('gPin').focus(), 100); }
$('gateForm').onsubmit = async (e) => { e.preventDefault(); S.pin = $('gPin').value.trim(); if (!S.pin) return; try { await load(); ls.set('plausana_pin', S.pin); } catch (err) { showGate(err.message); } };
function logout() { ls.del('plausana_pin'); S.pin = ''; S.D = null; closeSheet(); showGate(''); }

async function load(keepView) {
  const t = S.D ? S.D.today : '';
  const r = await api('boot', t ? { from: addDays(t, -7), to: addDays(t, 21) } : {});
  S.D = r; if (!S.day) S.day = r.today; if (!S.ym) S.ym = r.today.slice(0, 7);
  S.objBy = {}; r.objects.forEach(o => S.objBy[o.anorm] = o);
  $('vGate').hidden = true; $('vApp').hidden = false; $('tabs').hidden = false;
  $('hdSub').textContent = r.me.name + ' · ' + (ROLE[r.me.role] || r.me.role);
  $('btnMe').textContent = r.me.name.split(/\s+/).map(x => x[0]).join('').slice(0, 2).toUpperCase();
  drawTabs(); if (S.tab === 'month') S.month = null; draw();
}
function drawTabs() {
  const T = [['today', 'Šodien']].concat(can('vaditajs') ? [['month', 'Grafiks'], ['objs', 'Objekti']] : []).concat(can('admin') ? [['rules', 'Noteikumi']] : []);
  if (!T.some(x => x[0] === S.tab)) S.tab = 'today';
  $('tabs').innerHTML = T.map(([k, l]) => `<button type="button" data-t="${k}" class="${S.tab === k ? 'on' : ''}">${l}</button>`).join('');
  $('tabs').hidden = T.length < 2;
}
$('tabs').onclick = (e) => { const b = e.target.closest('[data-t]'); if (!b) return; S.tab = b.dataset.t; drawTabs(); draw(); scrollTo(0, 0); };
$('btnRefresh').onclick = () => load().then(() => toast('Atjaunots')).catch(err => toast(err.message, 'err'));
$('btnTheme').onclick = () => { const d = document.documentElement.dataset.theme === 'dark' ? '' : 'dark'; document.documentElement.dataset.theme = d; ls.set('plausana_theme', d); };
$('btnMe').onclick = () => { const s = sheet(`<div class="hd"><h3>${esc(S.D.me.name)}</h3>${X}</div><p style="font-weight:700;color:var(--ink2);margin:0 0 14px">${esc(ROLE[S.D.me.role] || '')}</p><button class="pill big" style="width:100%" id="mOut">Iziet</button>`);
  s.querySelector('#mOut').onclick = logout; };

function draw() {
  const v = $('view');
  if (S.tab === 'today') return drawDay(v);
  if (S.tab === 'month') return drawMonth(v);
  if (S.tab === 'objs') return drawObjs(v);
  if (S.tab === 'rules') return drawRules(v);
}

/* ---------- Šodien ---------- */
function drawDay(v) {
  const D = S.D, t = D.today, d = S.day;
  $('hdTitle').textContent = d === t ? 'Šodien' : d === addDays(t, 1) ? 'Rīt' : lvLong(d);
  const list = D.visits.filter(x => x.datums === d).sort((a, b) => (a.statuss === 'done') - (b.statuss === 'done') || b.prio - a.prio || a.adrese.localeCompare(b.adrese, 'lv'));
  const done = list.filter(x => x.statuss === 'done'), m2 = (xs) => xs.reduce((n, x) => n + (+((S.objBy[x.anorm] || {}).m2) || 0), 0);
  const mm = D.rain[d] || 0, mmT = D.rain[addDays(d, 1)] || 0;
  const moved = D.visits.filter(x => x.statuss === 'plan' && x.prio && x.datums > d && x.datums <= addDays(d, 3)).length;
  const days = [-1, 0, 1, 2].map(i => addDays(t, i)).filter(x => dow(x) <= 6 || x === d); if (days.indexOf(d) === -1) days.push(d);
  v.innerHTML = `<div class="seg" style="margin:0 0 12px">${days.map(x => `<button type="button" data-d="${x}" class="${x === d ? 'on' : ''}">${x === t ? 'Šodien' : x === addDays(t, 1) ? 'Rīt' : x === addDays(t, -1) ? 'Vakar' : WD[dow(x) - 1] + ' ' + lvS(x)}</button>`).join('')}</div>

/* ---------- Izpilde: atzīmēt nopļautu / nevar ---------- */
function shrink(file, max) {
  return new Promise((res, rej) => { const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', 0.82)); };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Neizdevās nolasīt bildi')); }; img.src = u; });
}
function openVisit(id) {
  const x = S.D.visits.find(v => v.id === id); if (!x) return;
  const o = S.objBy[x.anorm] || {};

    <div class="card mint" style="margin:0 0 12px"><div style="display:flex;flex-wrap:wrap;gap:8px">
      <span class="chip" style="background:var(--surf)">${m2f(o.m2)} m²</span><span class="chip" style="background:var(--surf)">ik ${o.intervals || S.D.cfg.interval} dienas</span>
      ${o.piekluve ? `<span class="chip wrap" style="background:var(--surf)">Piekļuve: ${esc(o.piekluve)}</span>` : ''}</div>${o.piezime ? `<p style="margin:10px 0 0;font-weight:700">${esc(o.piezime)}</p>` : ''}</div>`;
  if (x.statuss === 'done') {

    sheet(head + `<p style="font-weight:800;margin:0 0 6px">Nopļauts ${esc(lvS(x.datums))} ${esc(x.laiks)} · ${esc(x.izpilditajs)}</p>${x.piezime ? `<p style="font-weight:700;color:var(--ink2);margin:0 0 8px">${esc(x.piezime)}</p>` : ''}
      <div class="thumbs">${ph.map(p => `<a href="${IMG.replace('w400', 'w1600') + encodeURIComponent(p)}" target="_blank" rel="noopener"><img src="${IMG + encodeURIComponent(p)}" alt="Bilde pēc pļaušanas"></a>`).join('') || '<span style="font-weight:700;color:var(--ink3)">Bez bildes</span>'}</div>`);
    return;
  }
  const P = { photos: [], why: '' };

      <input type="file" id="phIn" accept="image/*" capture="environment" multiple hidden></div>
    <div class="checks f"><label><input type="checkbox" checked> Zāliens nopļauts</label><label><input type="checkbox"> Malas apgrieztas</label><label><input type="checkbox"> Zāle savākta</label></div>
    <div class="f"><label for="vNote">Piezīme vadītājam</label><input id="vNote" placeholder="Piem. pie bērnu laukuma bedre"></div>
    <div class="f"><span class="lb">Nevar izpildīt? Adrese pārcelsies pati</span><div class="chips" id="why">${['Lietus', 'Slapjš zāliens', 'Nav piekļuves', 'Tehnika', 'Nepaspēju'].map(w => `<button type="button" data-w="${w}">${w}</button>`).join('')}</div></div>
    <div class="acts"><button class="btn-rose" id="vCant">Nevar</button><button class="btn-dk" id="vDone">Nopļauts</button></div>`);
  const drawPh = () => { s.querySelector('#phs').innerHTML = P.photos.map((p, i) => `<div class="ph" style="background-image:url('${p}')"><button type="button" data-rm="${i}" aria-label="Noņemt bildi">×</button></div>`).join('')
    + (P.photos.length < 4 ? `<button type="button" class="add" id="phAdd"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Bilde</button>` : ''); };

  s.querySelector('#phIn').onchange = async (e) => { for (const f of [...e.target.files].slice(0, 4 - P.photos.length)) { try { P.photos.push(await shrink(f, 1400)); } catch (err) { toast(err.message, 'err'); } } e.target.value = ''; drawPh(); };

    if (S.D.cfg.photoReq && !P.photos.length) return toast('Pievienojiet bildi pēc pļaušanas', 'err');

  };
  s.querySelector('#vCant').onclick = async (e) => {

  };
}

  const nextBy = {}; D.visits.filter(x => x.statuss === 'plan').forEach(x => { if (!nextBy[x.anorm] || x.datums < nextBy[x.anorm]) nextBy[x.anorm] = x.datums; });
  const g = (D.groups || []).find(x => x.name === S.grp), inG = g ? new Set(g.adreses) : null;
  const nq = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const L = D.objects.filter(o => (!inG || inG.has(o.adrese)) && (!S.q || nq(o.adrese + ' ' + (o.vaditajs || '')).includes(nq(S.q))))
    .sort((a, b) => ((b.m2 > 0 && b.aktivs !== 0) - (a.m2 > 0 && a.aktivs !== 0)) || a.adrese.localeCompare(b.adrese, 'lv'));
  const on = D.objects.filter(o => o.m2 > 0 && o.aktivs !== 0);
  v.innerHTML = `<div class="card mint" style="margin:0 0 12px"><b style="font-size:15px;font-weight:800">${on.length} objekti pļaušanā · ${m2f(on.reduce((s, o) => s + (+o.m2 || 0), 0))} m²</b>
      <p style="margin:4px 0 0;font-size:13px;font-weight:700;color:var(--ink2)">Grafikā nonāk objekti ar m² > 0. Ievadiet platību un intervālu — datumus grafiks izliks pats.</p></div>
    <div class="search"><input id="oq" placeholder="Meklēt adresi…" value="${esc(S.q)}" aria-label="Meklēt adresi"><div class="seg">${['', ...(D.groups || []).map(x => x.name)].map(n => `<button type="button" data-g="${esc(n)}" class="${S.grp === n ? 'on' : ''}">${n ? esc(n.replace('Valsts nekustamie īpašumi', 'VNĪ')) : 'Visi'}</button>`).join('')}</div>

        <span class="chip">${act ? 'Pļaušanā' : '+ Pievienot'}</span></button>`; }).join('') || '<div class="card empty">Nekas neatbilst</div>'}
      ${L.length > 300 ? `<p class="copy">Rāda 300 no ${L.length} — sašauriniet meklēšanu</p>` : ''}</div>`;
  const q = $('oq'); q.oninput = () => { const p = q.selectionStart; S.q = q.value; drawObjs(v); const q2 = $('oq'); q2.focus(); q2.setSelectionRange(p, p); };

  const ga = $('gAll'); if (ga) ga.onclick = () => editGroup(g);

      <div class="card f"><span class="lb">Slodze un intervāls</span><div class="row2"><div class="f"><label for="cM">Maks. m² dienā</label><input id="cM" type="number" step="100" min="100" value="${C.maxM2}"></div>
        <div class="f"><label for="cI">Intervāls pēc noklusējuma (dienas)</label><input id="cI" type="number" min="1" max="90" value="${C.interval}"></div></div></div>
      <div class="card f"><span class="lb">Sezona un darba dienas</span><div class="row2"><div class="f"><label for="cS1">No (MM-DD)</label><input id="cS1" value="${C.season[0]}" pattern="\\d\\d-\\d\\d"></div><div class="f"><label for="cS2">Līdz (MM-DD)</label><input id="cS2" value="${C.season[1]}"></div></div>
        <div class="chips" id="cWd">${WD.map((w, i) => `<button type="button" data-w="${i + 1}" class="${C.workdays.indexOf(i + 1) !== -1 ? 'on' : ''}">${w}</button>`).join('')}</div></div>
      <div class="card f checks"><label><input type="checkbox" id="cPh" ${C.photoReq ? 'checked' : ''}> Bilde pēc pļaušanas obligāta</label></div>
      <button class="pill dk big" id="cSave" style="width:100%">Saglabāt un pārplānot</button></div>
    <div class="side"><div class="card"><b style="font-weight:800">Lietus prognoze (Rīga)</b><div class="log" style="margin-top:8px">${Object.keys(S.D.rain).sort().map(d => `<div style="background:${(S.D.rain[d] || 0) >= C.rainMm ? 'var(--sky)' : 'var(--surf2)'}"><b>${WD[dow(d) - 1]} ${lvS(d)} · ${(+S.D.rain[d]).toFixed(1)} mm</b></div>`).join('') || '<div><span>Prognoze tiks ielādēta pirmajā rītā</span></div>'}</div></div></div></div>`;
  $('cWd').onclick = (e) => { const b = e.target.closest('[data-w]'); if (b) b.classList.toggle('on'); };
  $('cSave').onclick = async (e) => { e.target.disabled = true;
    try { const cfg = { rainMm: +$('cR').value, wetDays: +$('cW').value, maxM2: +$('cM').value, interval: +$('cI').value, season: [$('cS1').value.trim(), $('cS2').value.trim()],
        workdays: [...$('cWd').querySelectorAll('.on')].map(b => +b.dataset.w), photoReq: $('cPh').checked };
      const r = await api('saveCfg', { cfg }); toast('Saglabāts · +' + r.added + ' jauni, ' + r.moved + ' pārcelti'); await load(); } catch (err) { toast(err.message, 'err'); } finally { e.target.disabled = false; } };
}

/* ---------- start ---------- */
(function () { const th = ls.get('plausana_theme'); if (th) document.documentElement.dataset.theme = th;
  const h = location.hash.slice(1); if (h && ['today', 'month', 'objs', 'rules'].indexOf(h) !== -1) S.tab = h;
  if (!S.pin) return showGate('');
  load().catch(err => { if (err.code === 'auth') { ls.del('plausana_pin'); S.pin = ''; showGate('PIN vairs nederīgs vai nav piekļuves pļaušanai'); } else { showGate(err.message); } });
})();
</script>
</body>
</html>
